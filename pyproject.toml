[project]
name = "deepstream-vms-backend"
version = "1.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL (TEST_DATABASE_URL)",
  "kafka: needs a Kafka broker (TEST_KAFKA_BOOTSTRAP)",
  "gpu: needs an NVIDIA GPU + DeepStream runtime",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]   # errors and pyflakes; keep CI signal high
ignore = ["E501", "E701", "E702", "E741"]  # long / compact lines are a style choice here
per-file-ignores = {"tests/integration/test_security.py" = ["F811"]}  # pytest fixture re-use
