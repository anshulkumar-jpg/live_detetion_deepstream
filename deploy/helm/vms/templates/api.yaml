apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "vms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}-api}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          env: [{name: SERVICE_NAME, value: vms-api}]
          {{- include "vms.env" . | nindent 10 }}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15, failureThreshold: 4}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "vms.securityContext" . | nindent 10 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "vms.labels" . | nindent 4 }}
spec:
  selector: {app: {{ .Release.Name }}-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
spec:
  minAvailable: 1
  selector: {matchLabels: {app: {{ .Release.Name }}-api}}
