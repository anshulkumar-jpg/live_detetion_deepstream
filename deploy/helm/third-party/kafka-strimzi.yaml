# Kafka via the Strimzi operator (KRaft). Install the operator first:
#   helm install strimzi oci://quay.io/strimzi-helm/strimzi-kafka-operator -n vms
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual
  labels: {strimzi.io/cluster: vms-kafka}
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes: [{id: 0, type: persistent-claim, size: 200Gi, deleteClaim: false, kraftMetadata: shared}]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: vms-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    listeners:
      - {name: plain, port: 9092, type: internal, tls: false}
      - {name: tls, port: 9093, type: internal, tls: true, authentication: {type: scram-sha-512}}
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
      log.retention.hours: 24
  entityOperator: {topicOperator: {}, userOperator: {}}
