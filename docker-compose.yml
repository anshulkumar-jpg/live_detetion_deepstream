# Single NVIDIA GPU server deployment.
#   docker compose up -d                                  core: control plane + GPU agent + video
#   docker compose --profile analytics up -d              + MTMC, Milvus, Logstash, Elasticsearch, Kibana
#   docker compose --profile monitoring up -d             + Prometheus, Grafana, Kafka exporter
# Requires: Docker Engine, NVIDIA driver, NVIDIA Container Toolkit; secrets in .env (see .env.example).

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vms}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_DEFAULT_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-12}
  NODE_ID: ${NODE_ID:-gpu-node-1}
  CAMERAS_PER_WORKER: ${CAMERAS_PER_WORKER:-2}
  DEFAULT_MAX_STREAMS_PER_GPU: ${DEFAULT_MAX_STREAMS_PER_GPU:-8}
  DEFAULT_STREAM_MEMORY_MB: ${DEFAULT_STREAM_MEMORY_MB:-350}
  MEDIAMTX_API_URL: http://mediamtx:9997
  MEDIAMTX_RTSP_PUSH_URL: rtsp://mediamtx:8554
  MEDIAMTX_PUBLIC_HLS_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}/hls
  MEDIAMTX_PUBLIC_WEBRTC_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}/webrtc
  MEDIAMTX_PUBLIC_RTSP_URL: ${PUBLIC_RTSP_URL:-rtsp://localhost:8554}
  MILVUS_URI: http://milvus:19530
  EMBEDDING_DIM: ${EMBEDDING_DIM:-256}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vms}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms} -d ${POSTGRES_DB:-vms}"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: 12
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  migrate:
    build: {context: ., dockerfile: docker/Dockerfile.api}
    image: vms-api:latest
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  api:
    image: vms-api:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: vms-api
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    expose: ["8000"]

  scheduler:
    image: vms-api:latest
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler_main"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 15s
      timeout: 3s
      retries: 5
    expose: ["9101"]

  gpu-agent:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    image: vms-worker:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      MODEL_REPOSITORY_DIR: /models
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ${MODEL_REPOSITORY_HOST_DIR:-./models}:/models          # ONNX/engines/labels; must be writable for engine caching
      - generated:/opt/vms/generated
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu, video, compute, utility]}]
    depends_on:
      kafka: {condition: service_healthy}
      scheduler: {condition: service_started}
    stop_grace_period: 30s
    expose: ["9102"]

  analytics-stream:
    image: vms-api:latest
    restart: unless-stopped
    command: ["python", "-m", "analytics.stream"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9103/metrics"]
      interval: 15s
      timeout: 3s
      retries: 5
    expose: ["9103"]

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes: [./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro]
    ports:
      - "8554:8554"        # RTSP (read; publish only from private network with internal token)
      - "8189:8189/udp"    # WebRTC ICE
      - "8189:8189/tcp"    # WebRTC ICE (TCP fallback)
    expose: ["9997", "9998", "8888", "8889", "1935"]

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    restart: unless-stopped
    volumes:
      - ./deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${TLS_CERT_DIR:-./deploy/envoy/certs}:/etc/envoy/certs:ro
    ports: ["8443:8443"]
    depends_on: [api, mediamtx]

  # ------------------------------------------------------------------ analytics profile
  mtmc:
    image: vms-api:latest
    profiles: [analytics]
    restart: unless-stopped
    command: ["python", "-m", "analytics.mtmc"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      milvus: {condition: service_healthy}
    expose: ["9104"]

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    profiles: [analytics]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcddata:/etcd]

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles: [analytics]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: minio server /minio_data
    volumes: [miniodata:/minio_data]

  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: [analytics]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [milvusdata:/var/lib/milvus]
    depends_on: [etcd, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 60s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: [analytics]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # internal network only; enable security + TLS for production clusters
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    volumes: [esdata:/usr/share/elasticsearch/data]
    expose: ["9200"]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: [analytics]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LS_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - ./deploy/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./deploy/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on: [kafka, elasticsearch]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: [analytics]
    restart: unless-stopped
    environment: {ELASTICSEARCH_HOSTS: http://elasticsearch:9200}
    ports: ["127.0.0.1:5601:5601"]
    depends_on: [elasticsearch]

  # ------------------------------------------------------------------ monitoring profile
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on: [kafka]

volumes:
  pgdata: {}
  kafkadata: {}
  generated: {}
  etcddata: {}
  miniodata: {}
  milvusdata: {}
  esdata: {}
  promdata: {}
