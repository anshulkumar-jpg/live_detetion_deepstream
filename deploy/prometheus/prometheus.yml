global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: scheduler
    static_configs: [{targets: ["scheduler:9101"]}]
  - job_name: gpu-agent           # GPU, NVDEC/NVENC, per-camera FPS/latency, per-worker GPU memory
    static_configs: [{targets: ["gpu-agent:9102"]}]
  - job_name: analytics-stream
    static_configs: [{targets: ["analytics-stream:9103"]}]
  - job_name: mtmc
    static_configs: [{targets: ["mtmc:9104"]}]
  - job_name: mediamtx
    basic_auth: {username: metrics, password_file: /etc/prometheus/secrets/mediamtx_metrics}
    static_configs: [{targets: ["mediamtx:9998"]}]
  - job_name: kafka-exporter      # consumer lag
    static_configs: [{targets: ["kafka-exporter:9308"]}]
