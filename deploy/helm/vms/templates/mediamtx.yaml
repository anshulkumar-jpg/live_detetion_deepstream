apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mediamtx
data:
  mediamtx.yml: |
{{ .Files.Get "files/mediamtx.yml" | replace "http://api:8000" (printf "http://%s-api:8000" .Release.Name) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mediamtx
  labels: {{- include "vms.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ .Release.Name }}-mediamtx}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-mediamtx}
      annotations:
        checksum/config: {{ .Files.Get "files/mediamtx.yml" | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9998"
    spec:
      containers:
        - name: mediamtx
          image: {{ .Values.mediamtx.image }}
          ports:
            - {name: rtsp, containerPort: 8554}
            - {name: hls, containerPort: 8888}
            - {name: webrtc, containerPort: 8889}
            - {name: webrtc-ice, containerPort: 8189, protocol: UDP}
            - {name: api, containerPort: 9997}
            - {name: metrics, containerPort: 9998}
          readinessProbe: {tcpSocket: {port: rtsp}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: rtsp}, periodSeconds: 20}
          resources: {{- toYaml .Values.mediamtx.resources | nindent 12 }}
          volumeMounts: [{name: config, mountPath: /mediamtx.yml, subPath: mediamtx.yml}]
      volumes: [{name: config, configMap: {name: {{ .Release.Name }}-mediamtx}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mediamtx
spec:
  type: {{ .Values.mediamtx.service.type }}
  selector: {app: {{ .Release.Name }}-mediamtx}
  ports:
    - {name: rtsp, port: 8554, targetPort: rtsp}
    - {name: hls, port: 8888, targetPort: hls}
    - {name: webrtc, port: 8889, targetPort: webrtc}
    - {name: webrtc-ice, port: 8189, targetPort: webrtc-ice, protocol: UDP}
    - {name: api, port: 9997, targetPort: api}
    - {name: metrics, port: 9998, targetPort: metrics}
