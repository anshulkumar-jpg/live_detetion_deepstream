# Kafka -> Logstash (ETL) -> Elasticsearch, as in the NVIDIA MTMC reference architecture.
input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}"
    topics => ["${KAFKA_TOPIC_PREFIX:}detection.events", "${KAFKA_TOPIC_PREFIX:}analytics.events", "${KAFKA_TOPIC_PREFIX:}reid.events", "${KAFKA_TOPIC_PREFIX:}pipeline.events"]
    group_id => "logstash-es"
    client_id => "logstash"
    codec => "json"
    decorate_events => "basic"
    auto_offset_reset => "latest"
    consumer_threads => 4
  }
}

filter {
  mutate { add_field => { "[@metadata][topic]" => "%{[@metadata][kafka][topic]}" } }
  if [timestamp] {
    date { match => ["timestamp", "ISO8601"] target => "@timestamp" }
  }
  # pipeline.events wrap data in an envelope; lift camera/worker ids for searching
  if [payload][camera_id] { mutate { copy => { "[payload][camera_id]" => "camera_id" } } }
  if [payload][worker_id] { mutate { copy => { "[payload][worker_id]" => "worker_id" } } }
  # bbox as numbers, drop raw embeddings if a producer ever adds them
  mutate { remove_field => ["embedding"] }
  if [@metadata][topic] =~ /detection\.events$/ { mutate { add_field => { "[@metadata][index]" => "vms-detections" } } }
  else if [@metadata][topic] =~ /analytics\.events$/ { mutate { add_field => { "[@metadata][index]" => "vms-analytics" } } }
  else if [@metadata][topic] =~ /reid\.events$/ { mutate { add_field => { "[@metadata][index]" => "vms-reid" } } }
  else { mutate { add_field => { "[@metadata][index]" => "vms-pipeline" } } }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    # event_id makes indexing idempotent: Kafka redelivery does not duplicate documents
    document_id => "%{event_id}"
    action => "index"
  }
}
