# Kafka via the Strimzi operator (KRaft). Install the operator first:
#   helm install strimzi oci://quay.io/strimzi-helm/strimzi-kafka-operator -n vms
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual
  labels: {strimzi.io/cluster: vms-kafka}
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes: [{id: 0, type: persistent-claim, size: 200Gi, deleteClaim: false, kraftMetadata: shared}]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: vms-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # TLS + SCRAM-SHA-512 only (no plaintext listener), and per-topic ACLs enforced by the "simple" authorizer.
    listeners:
      - {name: tls, port: 9093, type: internal, tls: true, authentication: {type: scram-sha-512}}
    authorization: {type: simple}
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
      log.retention.hours: 24
  entityOperator: {topicOperator: {}, userOperator: {}}
---
# Least privilege: vms-scheduler can only touch the topics it needs (same rules as deploy/kafka/kafka-init.sh).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: vms-scheduler
  labels: {strimzi.io/cluster: vms-kafka}
spec:
  authentication: {type: scram-sha-512}
  authorization:
    type: simple
    acls:
      - {resource: {type: topic, name: pipeline.commands, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: topic, name: camera.status, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: topic, name: worker.heartbeat, patternType: literal}, operations: [Read, Describe]}
      - {resource: {type: topic, name: pipeline.events, patternType: literal}, operations: [Read, Describe]}
      - {resource: {type: topic, name: worker.heartbeat.dlq, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: topic, name: pipeline.events.dlq, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: group, name: scheduler, patternType: literal}, operations: [Read]}
---
# Least privilege: vms-agent can only touch the topics it needs (same rules as deploy/kafka/kafka-init.sh).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
