# Model registry seed. Fill in YOUR three existing models (paths are relative to MODEL_REPOSITORY_DIR).
# Every key under nvinfer_properties is passed verbatim to Gst-nvinfer [property]; copy the
# preprocessing / parser settings your models already use (net-scale-factor, offsets,
# model-color-format, maintain-aspect-ratio, custom-lib-path, parse-bbox-func-name, ...).
# Register with:  python scripts/register_models.py --api https://... --user admin config/models/models.yaml
models:
  - id: person_detection            # placeholder id - rename to your model
    name: Person detector
    task: detector                  # detector | classifier | pose | segmentation | reid
    backend: nvinfer                # nvinfer (TensorRT) | nvinferserver (Triton, for models nvinfer cannot run)
    version:
      version: "1"
      onnx_file: person_detection/model.onnx
      # engine_file: person_detection/model.onnx_b2_gpu0_fp16.engine   # optional prebuilt engine
      labels: [person]
      precision: fp16               # fp32 | fp16 | int8 (int8 needs int8_calib_file)
      max_batch_size: 2
      input_shape: [3, 640, 640]
      nvinfer_properties:
        net-scale-factor: 0.0039215697906911373
        model-color-format: 0
        maintain-aspect-ratio: 1
        symmetric-padding: 1
        num-detected-classes: 1
        cluster-mode: 2
        # YOLO-style outputs need a custom parser library, e.g.:
        # custom-lib-path: person_detection/libnvdsinfer_custom_impl_Yolo.so
        # parse-bbox-func-name: NvDsInferParseYolo
      class_attrs:
        all: {pre-cluster-threshold: 0.4, nms-iou-threshold: 0.45, topk: 300}

  - id: vehicle_detection
    name: Vehicle detector
    task: detector
    version:
      version: "1"
      onnx_file: vehicle_detection/model.onnx
      labels: [car, truck, bus, motorcycle]
      nvinfer_properties: {net-scale-factor: 0.0039215697906911373, num-detected-classes: 4}

  - id: pose_detection
    name: Pose estimation
    task: pose                      # runs with output-tensor-meta=1; give its parser via nvinfer_properties
    version:
      version: "1"
      onnx_file: pose_detection/model.onnx
      nvinfer_properties: {net-scale-factor: 0.0039215697906911373}

  # Optional Re-ID embedding model for MTMC (e.g. NVIDIA ReIdentificationNet from NGC)
  # - id: reid
