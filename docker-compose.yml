# Single NVIDIA GPU server deployment.
#   docker compose up -d                                  core: control plane + GPU agent + video
#   docker compose --profile analytics up -d              + MTMC, Milvus, Logstash, Elasticsearch, Kibana
#   docker compose --profile monitoring up -d             + Prometheus, Grafana, Kafka exporter
# Requires: Docker Engine, NVIDIA driver, NVIDIA Container Toolkit; secrets in .env (see .env.example).

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vms}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_SSL_CA_LOCATION: /etc/kafka-ca/ca.pem
  KAFKA_DEFAULT_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-12}
  NODE_ID: ${NODE_ID:-gpu-node-1}
  CAMERAS_PER_WORKER: ${CAMERAS_PER_WORKER:-2}
  DEFAULT_MAX_STREAMS_PER_GPU: ${DEFAULT_MAX_STREAMS_PER_GPU:-8}
  DEFAULT_STREAM_MEMORY_MB: ${DEFAULT_STREAM_MEMORY_MB:-350}
  MEDIAMTX_API_URL: http://mediamtx:9997
  MEDIAMTX_RTSP_PUSH_URL: rtsp://mediamtx:8554
  MEDIAMTX_PUBLIC_HLS_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}/hls
  MEDIAMTX_PUBLIC_WEBRTC_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}/webrtc
  MEDIAMTX_PUBLIC_RTSP_URL: ${PUBLIC_RTSP_URL:-rtsp://localhost:8554}
  MILVUS_URI: http://milvus:19530
  EMBEDDING_DIM: ${EMBEDDING_DIM:-256}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vms}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms} -d ${POSTGRES_DB:-vms}"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    # kafka-init.sh creates the logins and permissions once the broker is up, then the health check turns green
    command: ["bash", "-c", "(tr -d '\\r' < /opt/vms/kafka-init.sh | bash) & exec /etc/kafka/docker/run"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # SASL_SSL (port 9092) is the only listener other containers can reach. CONTROLLER and LOOPBACK are plaintext but
      # bound to 127.0.0.1 inside this container, so nothing else can connect to them.
      KAFKA_LISTENERS: SASL_SSL://:9092,CONTROLLER://127.0.0.1:9093,LOOPBACK://127.0.0.1:9094
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:9092,LOOPBACK://127.0.0.1:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,LOOPBACK:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: LOOPBACK
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_SASL__SSL_SCRAM___SHA___512_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required;"
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: store.creds
      KAFKA_SSL_KEY_CREDENTIALS: store.creds
      KAFKA_OPTS: -Dvms.secured=true
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: 12
      # logins created by kafka-init.sh
      KAFKA_PASS_SCHEDULER: ${KAFKA_PASS_SCHEDULER:?run python scripts/make_kafka_security.py first}
      KAFKA_PASS_AGENT: ${KAFKA_PASS_AGENT:?run python scripts/make_kafka_security.py first}
      KAFKA_PASS_ANALYTICS: ${KAFKA_PASS_ANALYTICS:?run python scripts/make_kafka_security.py first}
      KAFKA_PASS_MTMC: ${KAFKA_PASS_MTMC:?run python scripts/make_kafka_security.py first}
      KAFKA_PASS_API: ${KAFKA_PASS_API:?run python scripts/make_kafka_security.py first}
      KAFKA_PASS_LOGSTASH: ${KAFKA_PASS_LOGSTASH:?run python scripts/make_kafka_security.py first}
      KAFKA_PASS_EXPORTER: ${KAFKA_PASS_EXPORTER:?run python scripts/make_kafka_security.py first}
    volumes:
      - kafkadata:/var/lib/kafka/data
      - ./deploy/kafka/certs:/etc/kafka/secrets:ro
      - ./deploy/kafka/kafka-init.sh:/opt/vms/kafka-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/kafka-ready && /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9094 >/dev/null 2>&1"]
      interval: 10s
      retries: 30

  migrate:
    build: {context: ., dockerfile: docker/Dockerfile.api}
    image: vms-api:latest
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  api:
    image: vms-api:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: vms-api
      MEDIAMTX_PUBLISH_TOKEN: ${MEDIAMTX_PUBLISH_TOKEN:?set MEDIAMTX_PUBLISH_TOKEN}   # checks worker publishes
      KAFKA_SASL_USERNAME: vms-api
      KAFKA_SASL_PASSWORD: ${KAFKA_PASS_API:?run python scripts/make_kafka_security.py first}
      MEDIAMTX_API_USER: vms-api
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:?run python scripts/make_mediamtx_secrets.py first}
      MEDIAMTX_METRICS_PASSWORD: ${MEDIAMTX_METRICS_PASSWORD:?run python scripts/make_mediamtx_secrets.py first}
      ALLOW_RAW_STREAMS: ${ALLOW_RAW_STREAMS:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
    volumes: [./deploy/kafka/certs/ca.pem:/etc/kafka-ca/ca.pem:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    expose: ["8000"]

  scheduler:
    image: vms-api:latest
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler_main"]
    environment:
      <<: *app-env
      COMMAND_SIGNING_KEY: ${COMMAND_SIGNING_KEY:?set COMMAND_SIGNING_KEY}   # signs the commands sent to GPU nodes
      KAFKA_SASL_USERNAME: vms-scheduler
      KAFKA_SASL_PASSWORD: ${KAFKA_PASS_SCHEDULER:?run python scripts/make_kafka_security.py first}
      MEDIAMTX_API_USER: vms-api
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:?run python scripts/make_mediamtx_secrets.py first}
      ALLOW_RAW_STREAMS: ${ALLOW_RAW_STREAMS:-false}
    volumes: [./deploy/kafka/certs/ca.pem:/etc/kafka-ca/ca.pem:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 15s
      timeout: 3s
      retries: 5
    expose: ["9101"]

  gpu-agent:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    image: vms-worker:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      MODEL_REPOSITORY_DIR: /models
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      MEDIAMTX_PUBLISH_TOKEN: ${MEDIAMTX_PUBLISH_TOKEN:?set MEDIAMTX_PUBLISH_TOKEN}   # used to publish annotated video
      COMMAND_SIGNING_KEY: ${COMMAND_SIGNING_KEY:?set COMMAND_SIGNING_KEY}   # checks the commands from the scheduler
      KAFKA_SASL_USERNAME: vms-agent
      KAFKA_SASL_PASSWORD: ${KAFKA_PASS_AGENT:?run python scripts/make_kafka_security.py first}
    volumes:
      - ${MODEL_REPOSITORY_HOST_DIR:-./models}:/models          # ONNX/engines/labels; must be writable for engine caching
      - generated:/opt/vms/generated
      - ./deploy/kafka/certs/ca.pem:/etc/kafka-ca/ca.pem:ro
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu, video, compute, utility]}]
    depends_on:
      kafka: {condition: service_healthy}
      scheduler: {condition: service_started}
    stop_grace_period: 30s
    expose: ["9102"]

  analytics-stream:
    image: vms-api:latest
    restart: unless-stopped
    command: ["python", "-m", "analytics.stream"]
    environment:
      <<: *app-env
      KAFKA_SASL_USERNAME: vms-analytics
      KAFKA_SASL_PASSWORD: ${KAFKA_PASS_ANALYTICS:?run python scripts/make_kafka_security.py first}
    volumes: [./deploy/kafka/certs/ca.pem:/etc/kafka-ca/ca.pem:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9103/metrics"]
      interval: 15s
      timeout: 3s
      retries: 5
    expose: ["9103"]

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes: [./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro]
    environment:
      # address(es) browsers use to reach this server for WebRTC, e.g. WEBRTC_ADDITIONAL_HOSTS=127.0.0.1,localhost,10.0.0.5
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1,localhost}
    ports:
      - "127.0.0.1:8554:8554"   # RTSP, this PC only (publishing needs the publish token; keep it off the LAN)
      - "8189:8189/udp"    # WebRTC ICE
      - "8189:8189/tcp"    # WebRTC ICE (TCP fallback)
    expose: ["9997", "9998", "8888", "8889", "1935"]

  envoy:
    image: envoyproxy/envoy:v1.31.10
    restart: unless-stopped
    volumes:
      - ./deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${TLS_CERT_DIR:-./deploy/envoy/certs}:/etc/envoy/certs:ro
    ports: ["8443:8443"]
    depends_on: [api, mediamtx]

  # ------------------------------------------------------------------ analytics profile
  mtmc:
    image: vms-api:latest
    profiles: [analytics]
    restart: unless-stopped
    command: ["python", "-m", "analytics.mtmc"]
    environment:
      <<: *app-env
      KAFKA_SASL_USERNAME: vms-mtmc
      KAFKA_SASL_PASSWORD: ${KAFKA_PASS_MTMC:?run python scripts/make_kafka_security.py first}
    volumes: [./deploy/kafka/certs/ca.pem:/etc/kafka-ca/ca.pem:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      milvus: {condition: service_healthy}
    expose: ["9104"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9104/metrics"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    profiles: [analytics]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcddata:/etcd]

  # MinIO was removed: the official minio/minio images are no longer published (Docker Hub and Quay), so Milvus
  # keeps its data on its own disk volume instead (storage type "local"). Fine for one GPU server.
  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: [analytics]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
    volumes: [milvusdata:/var/lib/milvus]
    depends_on: [etcd]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 60s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: [analytics]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"    # users + passwords required (the port is also not published to the host)
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run python scripts/vms.py init}
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    volumes: [esdata:/usr/share/elasticsearch/data]
    expose: ["9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  # One-shot: sets the Kibana password and creates a write-only login for Logstash (least privilege), then exits.
  es-setup:
    image: curlimages/curl:8.10.1
    profiles: [analytics]
    restart: "no"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run python scripts/vms.py init}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?run python scripts/vms.py init}
      LOGSTASH_ES_PASSWORD: ${LOGSTASH_ES_PASSWORD:?run python scripts/vms.py init}
    volumes: [./deploy/elasticsearch/setup.sh:/setup.sh:ro]
    entrypoint: ["sh", "/setup.sh"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: [analytics]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: logstash_writer
      ELASTICSEARCH_PASSWORD: ${LOGSTASH_ES_PASSWORD:?run python scripts/vms.py init}
      KAFKA_PASS_LOGSTASH: ${KAFKA_PASS_LOGSTASH:?run python scripts/make_kafka_security.py first}
      KAFKA_TRUSTSTORE_PASSWORD: ${KAFKA_KEYSTORE_PASSWORD:?run python scripts/make_kafka_security.py first}
      LS_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - ./deploy/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./deploy/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./deploy/kafka/certs/ca.p12:/etc/kafka-ca/ca.p12:ro
    depends_on:
      kafka: {condition: service_started}
      es-setup: {condition: service_completed_successfully}

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: [analytics]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?run python scripts/vms.py init}
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      es-setup: {condition: service_completed_successfully}

  # ------------------------------------------------------------------ monitoring profile
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/secrets:/etc/prometheus/secrets:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092", "--tls.enabled", "--tls.ca-file=/etc/kafka-ca/ca.pem", "--sasl.enabled",
              "--sasl.mechanism=scram-sha512", "--sasl.username=vms-exporter",
              "--sasl.password=${KAFKA_PASS_EXPORTER:?run python scripts/make_kafka_security.py first}"]
    volumes: [./deploy/kafka/certs/ca.pem:/etc/kafka-ca/ca.pem:ro]
    depends_on: [kafka]

volumes:
  pgdata: {}
  kafkadata: {}
  generated: {}
  etcddata: {}
  milvusdata: {}
  esdata: {}
  promdata: {}
