    acls:
      - {resource: {type: topic, name: pipeline.commands, patternType: literal}, operations: [Read, Describe]}
      - {resource: {type: topic, name: pipeline.commands.dlq, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: topic, name: pipeline.events, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: topic, name: worker.heartbeat, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: topic, name: pipeline.metrics, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: topic, name: detection.events, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: topic, name: embedding.events, patternType: literal}, operations: [Write, Describe]}
      - {resource: {type: group, name: agent-, patternType: prefix}, operations: [Read]}
---
